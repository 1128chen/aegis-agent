services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  aegis:
    build: .
    ports:
      - "8080:8080"
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_DATABASE_URL: postgresql://aegis:aegis-local@postgres:5432/aegis
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_ASYNC_WORKERS: 4
      AEGIS_SKILLS_DIR: /app/skills
      AEGIS_AUTH_REQUIRED: "true"
      AEGIS_AUTH_SECRET: ${AEGIS_AUTH_SECRET:-local-only-change-this-secret-123456}
      AEGIS_BOOTSTRAP_ADMIN_USERNAME: ${AEGIS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-aegis-local-admin}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
